<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Jolt · interaction and depth</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101828;
      color: #ecf4ff;
      font: 17px system-ui;
    }
    main {
      max-width: 880px;
      margin: 24px auto;
      padding: 24px;
    }
    h1 {
      font-size: 30px;
      margin: 0 0 8px;
    }
    p {
      color: #aabbd4;
      line-height: 1.5;
    }
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      padding: 12px 16px;
      border: 1px solid #435773;
      background: #263a57;
      color: inherit;
      border-radius: 10px;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid #63e3c2;
    }
    #stage {
      position: relative;
      height: 350px;
      margin: 22px 0;
      border: 1px solid #3b526c;
      border-radius: 16px;
      background: #16273c;
    }
    #source {
      position: absolute;
      left: 40px;
      top: 130px;
      width: 86px;
      height: 72px;
      display: grid;
      place-items: center;
      background: #63e3c2;
      color: #102c34;
      border-radius: 15px;
      font-weight: 700;
      cursor: grab;
    }
    .zone {
      position: absolute;
      right: 45px;
      width: 155px;
      height: 108px;
      border: 2px dashed #70a9b9;
      border-radius: 18px;
      display: grid;
      place-items: center;
    }
    #accept {
      top: 36px;
    }
    #reject {
      top: 200px;
      border-color: #e1a692;
    }
    .zone[data-hover] {
      background: #2c5764;
      border-style: solid;
    }
    #status {
      white-space: pre-wrap;
      color: #a4f0db;
      min-height: 55px;
    }
  </style>
  <main>
    <h1 id="title">Drop zones</h1>
    <p id="description">
      Drag the card to a target. A button offers the same acceptance action.
    </p>
    <nav>
      <button id="reset">Remount</button><button id="pause">Pause</button
      ><button id="request">Send to accepted target</button
      ><button id="replace">Replace</button><button id="seek">Seek 60%</button
      ><button id="inspect">Inspect</button>
    </nav>
    <div id="stage"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="/fixture.js"></script>
</html>
