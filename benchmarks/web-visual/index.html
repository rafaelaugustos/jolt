<!doctype html>
<html lang="en">
  <meta charset="UTF-8" /><title>Jolt Web visual motion</title
  ><style>
    body {
      background: #111827;
      color: #e5e7eb;
      font: 16px system-ui;
      padding: 32px;
    }
    button {
      font: inherit;
      padding: 12px;
    }
    .test-target {
      width: 160px;
      height: 100px;
      background: #f00;
      border: 4px solid #222;
      border-radius: 8px;
      color: white;
      box-sizing: border-box;
    }
    #stage {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    h1 {
      font-size: 24px;
    }
    body[data-demo] {
      margin: 0;
      padding: 0;
      background: #10141d;
    }
    body[data-demo] > h1,
    body[data-demo] > #stage {
      display: none;
    }
    .demo {
      box-sizing: border-box;
      width: 900px;
      min-height: 700px;
      padding: 38px 48px;
    }
    .eyebrow {
      color: #d6ef97;
      font: 600 12px system-ui;
      letter-spacing: 3px;
    }
    .demo h1 {
      font-size: 32px;
      margin: 12px 0 8px;
      letter-spacing: -0.8px;
    }
    .demo header p {
      color: #aab5c8;
      margin: 0 0 26px;
    }
    #demo-stage {
      height: 320px;
      padding: 24px;
      border: 1px solid #303949;
      border-radius: 20px;
      box-sizing: border-box;
      overflow: hidden;
      background: #181f2d;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
    }
    #controls button {
      background: #d6ef97;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      color: #162119;
      font: 600 14px system-ui;
      cursor: pointer;
    }
    .range-label {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      font-size: 14px;
      color: #c1cad9;
    }
    input[type='range'] {
      width: 400px;
      accent-color: #d6ef97;
    }
    #demo-status {
      color: #c1cad9;
      font-size: 14px;
      min-height: 40px;
      margin: 18px 0 8px;
    }
    footer {
      color: #7f8b9f;
      font-size: 12px;
    }
    .paint-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 100%;
    }
    .visual-card {
      width: 260px;
      height: 180px;
      background: #7655e8;
      color: white;
      border: 3px solid #c0a5ff;
      border-radius: 18px;
      font: 600 20px system-ui;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .visual-card small {
      font: 12px system-ui;
      margin-top: 12px;
    }
    #size-card {
      width: 320px;
      height: 118px;
      padding: 16px 20px;
      box-sizing: border-box;
      background: #7655e8;
      border-radius: 14px;
      color: #fff;
      overflow: hidden;
      font: 15px/1.5 system-ui;
    }
    #size-card p {
      margin: 8px 0;
    }
    .following {
      background: #d6ef97;
      color: #182218;
      border-radius: 10px;
      margin-top: 12px;
      padding: 10px 16px;
      font-size: 13px;
    }
    #tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .tile {
      height: 76px;
      border: 1px solid #a792eb;
      border-radius: 14px;
      background: #7655e8;
      color: white;
      font: 600 18px system-ui;
    }
    .scene-card {
      width: 100px;
      height: 100px;
      border-radius: 14px;
      background: #7655e8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 600 30px system-ui;
      margin-bottom: 18px;
    }
    #scene-b {
      background: #a7cc76;
      color: #213021;
    }
    #scene-value {
      position: absolute;
      margin-left: 640px;
      margin-top: -160px;
      font: 600 36px system-ui;
      color: #d6ef97;
    }
  </style>
  <h1>Jolt · Web visual motion</h1>
  <div id="stage"></div>
  <script type="module" src="/fixture.js"></script>
</html>
