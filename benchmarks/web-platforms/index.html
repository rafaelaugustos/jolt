<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,interactive-widget=resizes-visual"
  /><title>Jolt · Web platform interactions</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #10111a;
      color: #f4f3fb;
      font: 16px system-ui;
      padding: 32px;
    }
    main {
      max-width: 920px;
      margin: auto;
    }
    h1 {
      font-size: 30px;
      margin: 8px 0;
    }
    p {
      color: #b6bbcc;
      line-height: 1.5;
    }
    nav,
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    button,
    input {
      font: inherit;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #606a83;
      background: #252c42;
      color: inherit;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #394969;
    }
    button:focus-visible {
      outline: 3px solid #8fe3d1;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 420px;
      background: #1b2032;
      border: 0;
      border-radius: 18px;
      overflow: hidden;
    }
    .panel {
      visibility: hidden;
      background: #34415c;
      border-radius: 20px 20px 0 0;
      padding: 16px;
      color: white;
    }
    #sheet-handle,
    #modal-handle {
      padding: 16px;
      text-align: center;
      background: #61728b;
      border-radius: 12px;
      cursor: grab;
    }
    #content {
      overflow: auto;
      height: 180px;
      background: #26334b;
      padding: 16px;
      margin-top: 12px;
    }
    #content p {
      padding: 10px;
    }
    #backdrop {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: #05050a;
    }
    .ball {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #80dfc6;
      color: #11273a;
      font-weight: 700;
      cursor: grab;
    }
    dialog {
      width: 400px;
      padding: 24px;
      border: 0;
      border-radius: 20px;
      background: #34415c;
      color: #fff;
    }
    dialog::backdrop {
      background: #080a15bb;
    }
    #symbol {
      width: 130px;
      height: 130px;
      display: grid;
      place-items: center;
      font-size: 90px;
      margin: 100px auto;
    }
    #route {
      padding: 30px;
    }
    .card {
      background: #80dfc6;
      color: #152a36;
      border-radius: 16px;
      width: 150px;
      height: 110px;
      padding: 18px;
    }
    .destination {
      margin-left: 280px;
      width: 340px;
      height: 260px;
      background: #a3a2f4;
    }
    #keyboard-bar {
      position: absolute;
      bottom: 14px;
      left: 16px;
      right: 16px;
      background: #34415c;
      padding: 16px;
      border-radius: 12px;
    }
    #status {
      white-space: pre-wrap;
      font: 14px ui-monospace;
      color: #94e2c9;
      min-height: 50px;
    }
    small {
      color: #b6bbcc;
    }
  </style>
  <main>
    <small>JOLT / WEB RUNTIME · REAL BROWSER PLAYBACK</small>
    <h1 id="title">Platform interactions</h1>
    <p id="description"></p>
    <nav id="modes"></nav>
    <div id="stage"></div>
    <div class="controls">
      <button id="action">Run</button><button id="reverse">Reverse</button
      ><button id="pause">Pause</button><button id="play">Resume</button
      ><button id="dispose">Dispose</button>
    </div>
    <pre id="status"></pre>
    <small
      >CSS-pixel Web behavior. Native reference recordings are documented
      separately.</small
    >
  </main>
  <script type="module" src="/fixture.js"></script>
</html>
