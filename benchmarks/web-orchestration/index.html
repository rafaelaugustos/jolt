<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Jolt · Orchestration</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101a29;
      color: #e8edf6;
      font: 16px system-ui;
      padding: 40px;
      max-width: 960px;
    }
    header {
      display: flex;
      justify-content: space-between;
      color: #86c5b8;
      font-size: 13px;
      letter-spacing: 0.12em;
    }
    h1 {
      font-size: 34px;
      margin: 24px 0 10px;
      letter-spacing: -0.035em;
    }
    p {
      color: #adb9ce;
      line-height: 1.6;
      margin: 0 0 25px;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 350px;
      background: #162338;
      border: 1px solid #283b55;
      border-radius: 18px;
      padding: 24px;
      overflow: hidden;
    }
    .card {
      position: absolute;
      top: 32px;
      left: 32px;
      width: 120px;
      height: 80px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #86c5b8;
      color: #12302b;
      font-weight: 700;
      box-shadow: 0 10px 25px #07132155;
    }
    .test-target {
      width: 100px;
      height: 60px;
      background: #86c5b8;
      border: 0;
      border-radius: 12px;
    }
    .progress {
      height: 5px;
      border-radius: 4px;
      background: #283b55;
      margin: 18px 0 10px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      background: #a5b4fc;
      transform-origin: left;
      transform: scaleX(0);
    }
    #percentage {
      font-size: 12px;
      color: #a5b4fc;
      float: right;
    }
    #controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 25px;
    }
    button {
      background: #20324d;
      color: #e8edf6;
      border: 1px solid #3b526f;
      border-radius: 9px;
      padding: 10px 14px;
      font: 600 13px system-ui;
      cursor: pointer;
    }
    button:hover {
      background: #314969;
    }
    button:focus-visible {
      outline: 3px solid #86c5b8;
      outline-offset: 3px;
    }
    #status {
      margin-top: 18px;
      min-height: 38px;
      font-size: 14px;
      color: #adc5d7;
    }
  </style>
  <header><span>JOLT / WEB</span><span>ORCHESTRATION & CONTROL</span></header>
  <h1 id="title">Movement, composed.</h1>
  <p id="description">Native contracts. Browser execution.</p>
  <div id="stage"></div>
  <div class="progress"><div id="bar"></div></div>
  <span id="percentage">0%</span>
  <div id="controls"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="/fixture.js"></script>
</html>
