name: Release

# Publishing a GitHub release publishes both packages to npm.
# Pre-releases go out under the `next` tag, and under `latest` too until a
# stable version is out. Everything else goes out under `latest`.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5+
      - run: npm install --global npm@11
      - run: npm ci

      - name: Check the tag matches both packages
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG doesn't match package.json ($version)"
            exit 1
          fi
          native_version="v$(node -p "require('./packages/native/package.json').version")"
          if [ "$TAG" != "$native_version" ]; then
            echo "Release tag $TAG doesn't match the native plugin ($native_version)"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check-media
      - run: npm run docs:build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: node scripts/publish-packages.mjs
