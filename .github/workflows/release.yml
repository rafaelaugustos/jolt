name: Release

# Publish both npm packages from a version tag, before or with a GitHub release.
# Pre-releases go out under the `next` tag, and under `latest` too until a
# stable version is out. Everything else goes out under `latest`.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5+
      - run: npm install --global npm@11
      - run: npm ci && npm ci --prefix benchmarks/angular-tools

      - name: Check the tag matches both packages
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "Manual npm publication requires a version tag, not a branch."
            exit 1
          fi
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG doesn't match package.json ($version)"
            exit 1
          fi
          native_version="v$(node -p "require('./packages/native/package.json').version")"
          if [ "$TAG" != "$native_version" ]; then
            echo "Release tag $TAG doesn't match the native plugin ($native_version)"
            exit 1
          fi

          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check-media
      - run: npm run media:verify
      - run: npm run docs:build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: node scripts/publish-packages.mjs
