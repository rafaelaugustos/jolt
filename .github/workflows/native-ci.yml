name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # The macos-26 ARM image repeatedly stalls before the app can launch.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/native-app/package-lock.json
      - run: npm ci && npm run build && npm run benchmark:typecheck
      - run: python3 -m unittest discover -s benchmarks -p 'test_native_ci.py'
      - run: npm ci && npm run prepare:resources
        working-directory: benchmarks/native-app
      - name: Build production JavaScript for iOS Simulator
        timeout-minutes: 20
        run: npx ns build ios --env.production --no-hmr --for-device false --release
        working-directory: benchmarks/native-app
      # Keep simulator services idle until compilation releases the runner resources.
      - name: Boot a dedicated iOS 26.2 simulator after building
        timeout-minutes: 10
        run: |
          python3 - <<'PYBOOT'
          import os, pathlib, subprocess
          output = pathlib.Path('benchmarks/native-app/results')
          output.mkdir(parents=True, exist_ok=True)
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          device = subprocess.check_output([
              'xcrun', 'simctl', 'create', 'Jolt Native CI',
              'com.apple.CoreSimulator.SimDeviceType.iPhone-16', runtime,
          ], text=True, timeout=30).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'JOLT_SIMULATOR={device}\n')
          with (output / 'simulator-boot.log').open('w') as log:
              try:
                  subprocess.run(['xcrun', 'simctl', 'boot', device], check=True,
                                 stdout=log, stderr=subprocess.STDOUT, timeout=30)
                  subprocess.run(['xcrun', 'simctl', 'bootstatus', device, '-b'],
                                 check=True, stdout=log, stderr=subprocess.STDOUT, timeout=540)
              finally:
                  log.flush()
                  print((output / 'simulator-boot.log').read_text(), flush=True)
          PYBOOT
      - name: Native measurements and negative control
        timeout-minutes: 25
        run: python3 benchmarks/native-ci.py ios --device "$JOLT_SIMULATOR"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios
          path: benchmarks/native-app/results/

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/native-app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci && npm run build && npm run benchmark:typecheck
      - run: npm ci && npm run prepare:resources
        working-directory: benchmarks/native-app
      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run native measurements with negative control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: cd benchmarks/native-app && npx ns build android --env.production --no-hmr && cd ../.. && python3 benchmarks/native-ci.py android --device emulator-5554
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android
          path: benchmarks/native-app/results/
