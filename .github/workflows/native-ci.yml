name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/native-app/package-lock.json
      - run: npm ci && npm run build && npm run benchmark:typecheck
      - run: python3 -m unittest discover -s benchmarks -p 'test_native_ci.py'
      - run: npm ci && npm run prepare:resources
        working-directory: benchmarks/native-app
      - name: Build production JavaScript for iOS Simulator
        run: npx ns build ios --env.production --no-hmr --for-device false --release
        working-directory: benchmarks/native-app
      - name: Select available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          device = next(d['udid'] for runtime, group in devices['devices'].items() if '.iOS-' in runtime for d in group if d['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'JOLT_SIMULATOR={device}\n')
          PY
      - name: Native measurements and negative control
        run: python3 benchmarks/native-ci.py ios --device "$JOLT_SIMULATOR"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios
          path: benchmarks/native-app/results/

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/native-app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci && npm run build && npm run benchmark:typecheck
      - run: npm ci && npm run prepare:resources
        working-directory: benchmarks/native-app
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build production JavaScript with debuggable native shell
        run: npx ns build android --env.production --no-hmr
        working-directory: benchmarks/native-app
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native measurements and negative control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: python3 benchmarks/native-ci.py android --device emulator-5554
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android
          path: benchmarks/native-app/results/
