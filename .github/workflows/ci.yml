name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check-media
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node benchmarks/inspector-production.mjs
      - run: npm run benchmark:typecheck
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: sh benchmarks/android-particle-tests/run.sh
      - run: python3 benchmarks/live-spring-tests/test_solver.py
      - run: python3 -m unittest discover -s benchmarks -p 'test_sensor_*.py'
