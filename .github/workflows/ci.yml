name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      packages: ${{ github.event_name != 'pull_request' || steps.filter.outputs.packages == 'true' }}
      swiftui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.swiftui == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: .github
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml
  docs-playground:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --user pwuser
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check-media
      - run: npm run media:verify
      - run: npm run docs:build
      - name: Review every Web playground experiment
        env:
          JOLT_SITE_URL: http://127.0.0.1:5184
          JOLT_PLAYGROUND_ARTIFACTS: /tmp/jolt-playground-review
        run: |
          npm run docs:preview -- --host 127.0.0.1 --port 5184 > /tmp/jolt-playground-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$JOLT_SITE_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run docs:test-playground
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-playground-review
          path: |
            /tmp/jolt-playground-review/
            /tmp/jolt-playground-preview.log
  package-consumers:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --user pwuser
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/native-app/package-lock.json
      - run: npm ci && npm ci --prefix benchmarks/angular-tools
      - run: npm ci
        working-directory: benchmarks/native-app
      - run: npm run build
      - run: npm run parity:check
      - run: npm run package:check
      - run: npm run package:nuxt:check
      - run: npm run web:frameworks:test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-consumers
          path: |
            benchmarks/package-consumers/results/
            benchmarks/web-frameworks/results/
  web-interaction-depth:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Root installs PulseAudio; the browsers run as pwuser in the last step.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Firefox needs a real audio service even when no physical speaker exists.
      # Decode/play through PulseAudio's clocked null sink; do not mock HTMLAudio.
      # The image's Azure Ubuntu hosts stop resolving at times; kernel.org is an official mirror.
      - name: Install PulseAudio
        run: |
          sed -i -E 's#http://[a-z.]*ubuntu\.com/ubuntu/#http://mirrors.edge.kernel.org/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends pulseaudio pulseaudio-utils
      - run: npm run web:interaction-depth:typecheck
      - name: Verify interaction and audio in all browsers
        run: |
          chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
          runuser -u pwuser -- env "PATH=$PATH" bash -ec '
            pulseaudio --start --exit-idle-time=-1
            trap "pulseaudio --kill" EXIT
            pactl load-module module-null-sink sink_name=jolt-ci
            pactl set-default-sink jolt-ci
            npm run web:interaction-depth:test'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-interaction-depth-results
          path: benchmarks/web-interaction-depth/results/
  web-composition:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Keep this version aligned with @playwright/test in package.json. The image
    # includes browsers and OS libraries, avoiding slow per-run Ubuntu mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Match the runner-owned workspace/home; Firefox rejects root in that session.
      options: --ipc=host --user pwuser
    # All browser suites share this budget, including container/dependency setup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm ci --prefix benchmarks/angular-tools
      - run: npm run web:composition-portable:typecheck
      - run: npm run web:portable:typecheck
      - run: npm run web:parity:typecheck
      - run: npm run web:platforms:typecheck
      - run: npm run web:surfaces:typecheck
      - run: npm run web:effects:typecheck
      - run: npm run web:gestures:typecheck
      - run: npm run web:attachment:typecheck
      - run: npm run web:orchestration:typecheck
      - run: npm run web:typecheck
      - run: npm run web:lifecycle:typecheck
      - run: npm run web:visual:typecheck
      - run: npm run web:support:typecheck
      - run: npm run web:dynamic:typecheck
      - run: npm run web:integration:typecheck
      - run: npm run web:press:typecheck
      - run: npm run web:runtime:typecheck
      - run: npm run web:proof:typecheck
      - run: npm run web:proof:test
      - run: npm run web:runtime:test
      - run: npm run web:press:test
      - run: npm run web:integration:test
      - run: npm run web:dynamic:test
      - run: npm run web:support:test
      - run: npm run web:visual:test
      - run: npm run web:lifecycle:test
      - run: npm run web:composition-portable:test
      - run: npm run web:parity:test
      - run: npm run web:platforms:test
      - run: npm run web:surfaces:test
      - run: npm run web:effects:test
      - run: npm run web:gestures:test
      - run: npm run web:attachment:test
      - run: npm run web:orchestration:test
      # Firefox on Linux needs a display for the actual WebGL adapter fixture.
      # Keep WebGL assertions enabled; Xvfb provides the CI display, not a mock.
      # The X pointer starts at the screen centre. On a larger screen it stays off the browser
      # windows, whose stacking changes would otherwise send real button-less moves into a test.
      - run: xvfb-run --auto-servernum --server-args='-screen 0 3200x2400x24' npm run web:portable:test -- --headed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-composition-results
          path: |
            benchmarks/web-composition/results/
            benchmarks/web-runtime/results/
            benchmarks/web-press/results/
            benchmarks/web-integration/results/
            benchmarks/web-dynamic/results/
            benchmarks/web-support/results/
            benchmarks/web-visual/results/
            benchmarks/web-lifecycle/results/
            benchmarks/web-orchestration/results/
            benchmarks/web-attachment/results/
            benchmarks/web-gestures/results/
            benchmarks/web-effects/results/
            benchmarks/web-surfaces/results/
            benchmarks/web-platforms/results/
            benchmarks/web-parity/results/
            benchmarks/web-portable/results/
            benchmarks/web-composition-portable/results/
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Match the dependency installation used by the publishing workflow.
      - run: npm install --global npm@11
      - run: npm ci && npm ci --prefix benchmarks/angular-tools
      - run: npm run docs:check-media
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run core:check
      - run: npm run web:check
      - run: node benchmarks/inspector-production.mjs
      - run: npm run benchmark:typecheck
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: sh benchmarks/android-particle-tests/run.sh
      - run: python3 benchmarks/live-spring-tests/test_solver.py
      - run: python3 benchmarks/verify-live-color.py
      - run: python3 benchmarks/verify-circle-math.py
      - run: python3 benchmarks/verify-sensor-math.py --web
      - run: python3 -m unittest discover -s benchmarks/comparison -p 'test_*.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_sensor_*.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_scroll_header_text.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_scroll_header_accessibility.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_scroll_header_refresh.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_binding_*.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_gallery_text.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_gallery_accessibility.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_interactive_modal.py'

  swiftui:
    needs: changes
    if: needs.changes.outputs.swiftui == 'true'
    # iOS and macOS UI cases run side by side; the package checks run with macOS.
    name: swiftui (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: matrix.platform == 'macos'
        run: npm ci && npm ci --prefix benchmarks/angular-tools
      - if: matrix.platform == 'macos'
        run: npm run build && npm run swiftui:check
      - if: matrix.platform == 'macos'
        run: swift test
      - run: node scripts/swift-package.mjs "$RUNNER_TEMP/jolt-swift"
      - name: Run a command-line consumer alone, without the package's build directory
        if: matrix.platform == 'macos'
        env:
          JOLT_SWIFT_PACKAGE: ${{ runner.temp }}/jolt-swift
        run: benchmarks/swiftui-demo/cli/run.sh
      - run: gem install xcodeproj --no-document --user-install
      - name: Interact with the standalone ${{ matrix.platform }} app through the generated package
        env:
          JOLT_SWIFT_PACKAGE: ${{ runner.temp }}/jolt-swift
        run: python3 benchmarks/swiftui-demo/ci.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: swiftui-native-interaction-${{ matrix.platform }}
          path: benchmarks/swiftui-demo/results/
