name: Native desktop motion
on:
  push:
    branches: [feat/desktop-collections-rc18]
  pull_request:
    paths: ['src/desktop/**', 'src/core/**', 'benchmarks/desktop-motion/**', '.github/workflows/desktop-motion.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc -p tsconfig.build.json
      - run: npm ci --prefix benchmarks/desktop-motion
      - run: node benchmarks/desktop-motion/windows-host.mjs .local/runtime/node.exe
      - name: Locate the window recorder
        shell: pwsh
        run: |
          npm install --prefix .local/recorder --ignore-scripts @ffmpeg-installer/win32-x64@4.1.0
          (Resolve-Path .local/recorder/node_modules/@ffmpeg-installer/win32-x64).Path >> $env:GITHUB_PATH
      - name: Enable client animations on the disposable runner
        shell: pwsh
        run: |
          Add-Type -Name AnimationSettings -Namespace Jolt -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll", SetLastError=true)] public static extern bool SystemParametersInfo(uint action, uint param, System.IntPtr value, uint flags);'
          if (![Jolt.AnimationSettings]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3)) { throw 'Unable to enable client animations' }
      - name: Exercise the native XAML window
        run: .local/runtime/node.exe benchmarks/desktop-motion/windows.mjs windows-motion.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-motion
          path: windows-motion.mp4
